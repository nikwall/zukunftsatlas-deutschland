# Zukunftsatlas Deutschland 2035: Inhalt der Seite. Bauen: python build.py
# Quelle der Texte: ../unsicherheiten_v1.md, ../achsen_v1.md, ../signale_v1.md (Stand 13.11.2026).
# Löst ein Signal auf: aufgeloest = "ja" oder "nein" und aufgeloest_am = JJJJ-MM-TT setzen, neu bauen.
# Achse A senkrecht (plus = oben), Achse B waagerecht (plus = rechts). L und I sind Ergebnisse, keine Achsen.

[seite]
titel = "Zukunftsatlas Deutschland 2035"
stand = 2026-11-13
indexieren = true
beschreibung = "Wächst Deutschland in seine Rechnung hinein? Neun Unsicherheiten, zwei Achsen, vier Felder und 39 Signale, ausgehend vom Jahresgutachten 2026/27 des Sachverständigenrates."
overline = "Deutschland 2035 · Ausgangspunkt: Jahresgutachten 2026/27 des Sachverständigenrates"
leitfrage = "Wächst Deutschland in seine Rechnung hinein?"
einleitung = "Verteidigung, Zinsen und Alterung schreiben die Rechnung bis 2035 weitgehend fest. Offen ist, wie rau das Umfeld wird und wie breit die Basis, die sie trägt. 39 Signale zeigen früh, wohin es geht; das erste löst sich im Dezember 2026 auf."
gutachten_link = "https://www.sachverstaendigenrat-wirtschaft.de/jahresgutachten-2026.html"
url = "https://nikwall.github.io/zukunftsatlas-deutschland/"
repo = "https://github.com/nikwall/zukunftsatlas-deutschland"
kontakt = "kontakt@arqdecisions.com"

[[kennzahl]]
wert = "2,7–4,8 %"
text = "des BIP fehlen dem Bundeshaushalt 2040, je nachdem, wie schnell die Kredite für Verteidigung zurückgeführt werden."
[[kennzahl]]
wert = "78–98 %"
text = "des BIP beträgt der Schuldenstand 2040 in denselben Szenarien."
[[kennzahl]]
wert = "49,7 %"
text = "erreichen die Sozialbeiträge 2040 unter geltendem Recht, nach 42,3 % heute."
[[kennzahl]]
wert = "0,2–0,3 %"
text = "pro Jahr wächst das Produktionspotenzial bis 2031, weil das Arbeitsvolumen schrumpft."

# ---------------------------------------------------------------- Achsen
[achse.A]
frage = "Wie rau wird es von außen?"
pol_plus = "ruhiger"
pol_minus = "rauer"
kurz_plus = "ruhig"
kurz_minus = "rau"
aussage = "ein ruhigeres Umfeld"
p = 0.28
regel = "Das Umfeld ist <b>rau</b>, wenn mindestens zwei der drei Bestandteile zutreffen: Verteidigung bei 3,5 %, eine neue Krisenkasse, Gas 2028 nicht unter 45 €/MWh."
bestandteile = ["U6", "U9", "U7"]

[achse.B]
frage = "Wie breit wird die Basis?"
pol_plus = "breiter"
pol_minus = "schmaler"
kurz_plus = "breit"
kurz_minus = "schmal"
aussage = "eine breitere Basis"
p = 0.43
regel = "Die Basis ist <b>breit</b>, wenn mindestens zwei der vier Bestandteile zutreffen: Produktivität mindestens +1,2 % pro Jahr, Zuwanderung mindestens 200.000, Sozialbeiträge unter 46 %, Bundrendite nicht über dem Wachstum."
bestandteile = ["U2", "U3", "U4", "U5"]

# ---------------------------------------------------------------- Ergebnisse je Feld (Simulation, 400.000 Ziehungen)
[ergebnis.L]
name = "Lücke geschlossen"
frage = "Liegt das Staatsdefizit 2035 bei höchstens 3 % des BIP?"
je_feld = { PP = 0.75, MP = 0.49, PM = 0.55, MM = 0.29 }
[ergebnis.I]
name = "Industrie hält"
frage = "Erwirtschaftet die Industrie 2035 mindestens 17,5 % der Wertschöpfung?"
je_feld = { PP = 0.50, MP = 0.41, PM = 0.43, MM = 0.35 }

# ---------------------------------------------------------------- Felder (erste Stelle A, zweite B)
[feld.PP]
name = "Breites Wachstum"
kurz = "Ruhiger von außen, breitere Basis."
szene = "Die Lage beruhigt sich, Energie wird günstiger, neue Krisenkassen bleiben aus. Zuwanderung oder Produktivität tragen, und die Beiträge bleiben unter 46 %. Der Bund kann die Kredite für Verteidigung zurückführen, ohne an anderer Stelle hart zu kürzen."
zeichen = ["Waffenstillstand in der Ukraine, Gas wieder unter 45 €/MWh", "Beiträge unter 46 %, Zins unter dem Wachstum"]
[feld.MP]
name = "Wachstum unter Druck"
kurz = "Rauer von außen, die Basis wächst mit."
szene = "Verteidigung bei 3,5 %, teure Energie oder eine neue Krisenkasse, aber die Basis wächst mit: mehr Menschen, mehr Produktivität oder gebremste Beiträge. Höhere Einnahmen tragen einen Teil der Rechnung."
zeichen = ["NATO-Quote bei 3,5 %, Energie bleibt teuer", "Zuwanderung oder Produktivität über den Annahmen"]
[feld.PM]
name = "Stilles Altern"
kurz = "Ruhiger von außen, schmalere Basis."
szene = "Außen wird es ruhiger, innen schrumpft die Basis: wenig Zuwanderung, schwache Produktivität, steigende Beiträge, ein Zins über dem Wachstum. Weil die Rechnung von außen kleiner bleibt, schließt sich die Lücke in gut der Hälfte dieser Welten."
zeichen = ["Weniger Druck auf den Verteidigungshaushalt", "Beiträge über 46 %, Zuwanderung unter 200.000"]
[feld.MM]
name = "Doppelte Last"
kurz = "Rauer von außen, schmaler von innen."
szene = "Verteidigung, Krisen und Energie treiben die Ausgaben, während weniger Menschen mit wenig mehr Produktivität sie tragen. Die Annahmen des Jahresgutachtens liegen in diesem Feld: Verteidigung bei 3,5 %, teure Energie, Potenzialwachstum um 0,3 %, weniger Zuwanderung, Beiträge Richtung 50 %."
zeichen = ["Verteidigung bei 3,5 %, neue Krisenkasse", "Beiträge Richtung 50 %, Zins über dem Wachstum"]

